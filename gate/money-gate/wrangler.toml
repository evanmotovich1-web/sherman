# money-gate — the per-purchase authorization gate.
#
# No secrets in this file, ever. The one secret the worker needs is set at
# deploy time with `wrangler secret put STRIPE_WEBHOOK_SECRET` (README.md has
# the whole deploy walk-through). The KV namespace id is created at deploy
# and filled in below; it is an identifier, not a secret.

name = "money-gate"
main = "worker.js"
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "MONEY_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID_AT_DEPLOY"
